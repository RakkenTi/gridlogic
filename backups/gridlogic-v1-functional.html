<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>GridLogic — Space Engineers Visual Script &amp; GUI Studio</title>
<style>
:root {
  --bg-canvas: hsl(214, 21%, 9%);
  --bg-pane: hsl(214, 19%, 12%);
  --bg-surface: hsl(214, 17%, 15%);
  --bg-elevated: hsl(214, 16%, 19%);
  --bg-input: hsl(215, 22%, 10%);
  --border-subtle: hsl(214, 16%, 20%);
  --border-strong: hsl(214, 16%, 27%);
  --text-primary: hsl(210, 25%, 94%);
  --text-secondary: hsl(212, 15%, 68%);
  --text-muted: hsl(213, 12%, 49%);
  --amber: hsl(35, 82%, 54%);
  --amber-hover: hsl(35, 88%, 60%);
  --amber-text: hsl(214, 24%, 9%);
  --cyan: hsl(197, 65%, 54%);
  --green: hsl(156, 62%, 47%);
  --red: hsl(3, 76%, 60%);
  --warn: hsl(38, 90%, 54%);
  --font-sans: "Inter", "IBM Plex Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  --font-mono: "JetBrains Mono", "IBM Plex Mono", "Fira Code", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --radius-sm: 5px;
  --radius-md: 8px;
  --radius-lg: 11px;
  --shadow-card: 0 2px 6px rgba(0, 0, 0, 0.28), inset 0 1px 0 rgba(255, 255, 255, 0.045);
  --shadow-elevated: 0 12px 32px rgba(0, 0, 0, 0.45);
  --topbar-h: 54px;
}
*, *::before, *::after { box-sizing: border-box; }
html, body {
  margin: 0; padding: 0; height: 100%; min-height: 620px;
  background: var(--bg-canvas); color: var(--text-primary);
  font-family: var(--font-sans); font-size: 13.5px; line-height: 1.45;
  -webkit-font-smoothing: antialiased;
}
#app { height: 100%; min-height: 620px; }
.app-shell { display: flex; flex-direction: column; height: 100vh; min-height: 620px; overflow: hidden; }
.topbar {
  height: var(--topbar-h); flex: 0 0 var(--topbar-h);
  display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 0 14px;
  background: linear-gradient(180deg, hsl(214, 19%, 14%) 0%, hsl(214, 19%, 11.5%) 100%);
  border-bottom: 1px solid var(--border-subtle); z-index: 20;
}
.topbar-brand { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
.brand-icon { display: flex; align-items: center; justify-content: center; }
.brand-text { display: flex; flex-direction: column; }
.brand-name { margin: 0; font-size: 14px; font-weight: 800; letter-spacing: 0.12em; line-height: 1.1; }
.brand-sub { font-size: 11px; color: var(--text-muted); }
.topbar-project { display: flex; align-items: center; gap: 8px; flex: 1; max-width: 500px; min-width: 0; }
.script-name-input {
  flex: 1; min-width: 110px; height: 32px; padding: 0 10px;
  background: var(--bg-input); border: 1px solid var(--border-subtle); border-radius: var(--radius-sm);
  color: var(--text-primary); font-family: var(--font-sans); font-size: 13px; font-weight: 600;
}
.script-name-input:focus { outline: none; border-color: var(--amber); }
.topbar-actions { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
.btn-group { display: inline-flex; align-items: center; gap: 2px; padding-right: 4px; margin-right: 2px; border-right: 1px solid var(--border-subtle); }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  border: 1px solid transparent; border-radius: var(--radius-sm);
  font-family: var(--font-sans); font-weight: 600; cursor: pointer; white-space: nowrap;
  transition: background 0.14s ease, border-color 0.14s ease, color 0.14s ease, transform 0.1s ease;
}
.btn:active:not(:disabled) { transform: translateY(1px); }
.btn:disabled { opacity: 0.38; cursor: not-allowed; }
.btn-sm { height: 32px; padding: 0 10px; font-size: 12.5px; }
.btn-xs { height: 26px; padding: 0 8px; font-size: 11.5px; }
.btn-primary { background: var(--amber); color: var(--amber-text); border-color: hsl(35, 82%, 46%); box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.25); }
.btn-primary:hover:not(:disabled) { background: var(--amber-hover); }
.btn-primary.is-copied { background: var(--green); border-color: hsl(156, 62%, 38%); color: #091310; }
.btn-secondary { background: var(--bg-elevated); color: var(--text-primary); border-color: var(--border-strong); }
.btn-secondary:hover:not(:disabled) { background: hsl(214, 16%, 24%); }
.btn-ghost { background: transparent; color: var(--text-secondary); }
.btn-ghost:hover:not(:disabled) { background: var(--bg-elevated); color: var(--text-primary); }
.btn-amber-outline { background: rgba(232, 155, 45, 0.12); border-color: rgba(232, 155, 45, 0.4); color: hsl(36, 92%, 68%); }
.btn-amber-outline:hover:not(:disabled) { background: rgba(232, 155, 45, 0.22); }

.studio-grid { flex: 1; min-height: 0; display: grid; grid-template-columns: 274px minmax(340px, 1fr) 440px; }
.pane { min-width: 0; min-height: 0; display: flex; flex-direction: column; overflow: hidden; }
.pane-toolbox { background: var(--bg-pane); border-right: 1px solid var(--border-subtle); }
.pane-workspace { background: var(--bg-canvas); }
.pane-inspector { background: var(--bg-pane); border-left: 1px solid var(--border-subtle); }

/* Toolbox */
.toolbox-header { padding: 12px 12px 10px; border-bottom: 1px solid var(--border-subtle); display: flex; flex-direction: column; gap: 9px; flex-shrink: 0; }
.pane-title-row { display: flex; align-items: baseline; justify-content: space-between; }
.pane-title { margin: 0; font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-secondary); }
.pane-hint { font-size: 11px; color: var(--text-muted); }
.search-box { position: relative; display: flex; align-items: center; }
.search-icon { position: absolute; left: 9px; color: var(--text-muted); display: flex; pointer-events: none; }
.search-input { width: 100%; height: 31px; padding: 0 10px 0 30px; background: var(--bg-input); border: 1px solid var(--border-subtle); border-radius: var(--radius-sm); color: var(--text-primary); font-family: var(--font-sans); font-size: 12.5px; }
.search-input:focus { outline: none; border-color: var(--cyan); }
.cat-pills { display: flex; flex-wrap: wrap; gap: 5px; }
.cat-pill { display: inline-flex; align-items: center; gap: 5px; height: 25px; padding: 0 8px; background: var(--bg-surface); border: 1px solid var(--border-subtle); border-radius: 99px; color: var(--text-secondary); font-family: var(--font-sans); font-size: 11.5px; font-weight: 600; cursor: pointer; }
.cat-pill:hover, .cat-pill.active { background: var(--bg-elevated); border-color: var(--border-strong); color: var(--text-primary); }
.cat-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
.toolbox-list { flex: 1; overflow-y: auto; padding: 10px 10px 24px; display: flex; flex-direction: column; gap: 7px; }
.toolbox-group-heading { display: flex; align-items: center; gap: 6px; margin-top: 8px; margin-bottom: 2px; padding: 0 2px; font-size: 11px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--text-muted); }
.toolbox-group-heading:first-child { margin-top: 0; }
.palette-block { position: relative; display: flex; background: var(--bg-surface); border: 1px solid var(--border-subtle); border-left: 4px solid var(--block-color); border-radius: var(--radius-md); box-shadow: var(--shadow-card); cursor: grab; user-select: none; transition: transform 0.12s ease, background 0.12s ease; }
.palette-block:hover { background: var(--bg-elevated); border-color: var(--border-strong); border-left-color: var(--block-color); transform: translateX(2px); }
.palette-block.is-dragging { opacity: 0.45; cursor: grabbing; }
.palette-block-body { flex: 1; padding: 8px 9px; min-width: 0; }
.palette-block-top { display: flex; align-items: center; gap: 6px; }
.palette-block-title { font-size: 12.5px; font-weight: 650; color: var(--text-primary); flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.palette-c-badge { font-size: 10px; font-weight: 700; padding: 1px 5px; border-radius: 3px; background: rgba(255,255,255,0.06); color: var(--text-secondary); }
.palette-add-btn { width: 22px; height: 22px; display: inline-flex; align-items: center; justify-content: center; background: transparent; border: none; border-radius: 4px; color: var(--text-muted); cursor: pointer; flex-shrink: 0; }
.palette-block:hover .palette-add-btn { color: var(--text-primary); background: rgba(255,255,255,0.06); }
.palette-block-desc { margin-top: 2px; font-size: 11.5px; color: var(--text-muted); line-height: 1.32; }
.toolbox-empty { padding: 24px 12px; text-align: center; color: var(--text-muted); font-size: 12.5px; }

/* Workspace */
.workspace-hat { flex-shrink: 0; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px; padding: 10px 18px; background: hsl(214, 19%, 11%); border-bottom: 1px solid var(--border-subtle); }
.hat-left { display: flex; align-items: center; flex-wrap: wrap; gap: 12px; }
.hat-badge { font-size: 10.5px; font-weight: 800; letter-spacing: 0.08em; padding: 4px 8px; border-radius: 4px; background: rgba(232,155,45,0.16); color: hsl(36,92%,67%); }
.hat-control { display: inline-flex; align-items: center; gap: 7px; }
.hat-label { font-size: 12px; font-weight: 600; color: var(--text-secondary); }
.hat-select { height: 28px; padding: 0 8px; background: var(--bg-surface); border: 1px solid var(--border-strong); border-radius: var(--radius-sm); color: var(--text-primary); font-family: var(--font-sans); font-size: 12px; font-weight: 500; }
.hat-checkbox { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 500; color: var(--text-secondary); cursor: pointer; user-select: none; }
.hat-checkbox input { accent-color: var(--amber); }
.hat-metric { font-size: 11.5px; font-family: var(--font-mono); color: var(--text-muted); }
.workspace-scroll { flex: 1; overflow-y: auto; padding: 16px 20px 64px; }
.workspace-stack-host { max-width: 780px; margin: 0 auto; }
.block-stack { display: flex; flex-direction: column; }

.drop-zone { height: 8px; border-radius: 4px; transition: height 0.12s ease, background 0.12s ease, margin 0.12s ease; }
.drop-zone.is-over { height: 22px; margin: 3px 0; background: rgba(232,155,45,0.22); border: 1.5px dashed var(--amber); }
.drop-zone-empty { height: auto; min-height: 36px; display: flex; align-items: center; justify-content: center; padding: 8px 12px; border: 1px dashed var(--border-strong); border-radius: var(--radius-sm); color: var(--text-muted); font-size: 11.5px; background: rgba(0,0,0,0.14); }
.drop-zone-empty.is-over { min-height: 40px; background: rgba(232,155,45,0.16); border-color: var(--amber); color: var(--text-primary); }

.se-block { position: relative; background: var(--bg-surface); border: 1px solid var(--border-subtle); border-left: 5px solid var(--block-color); border-radius: var(--radius-md); box-shadow: var(--shadow-card); transition: border-color 0.14s ease, background 0.14s ease, opacity 0.14s ease; }
.se-block::before { content: ''; position: absolute; top: -1px; left: 20px; width: 24px; height: 4px; background: var(--bg-canvas); border-left: 1px solid var(--border-subtle); border-right: 1px solid var(--border-subtle); border-bottom: 1px solid var(--border-subtle); border-bottom-left-radius: 3px; border-bottom-right-radius: 3px; pointer-events: none; }
.nested-stack .se-block::before { background: hsl(214, 20%, 10.5%); }
.se-block:hover { border-color: var(--border-strong); border-left-color: var(--block-color); }
.se-block.is-selected { border-color: var(--amber); border-left-color: var(--block-color); background: hsl(214, 17%, 16.5%); }
.se-block.is-dragging { opacity: 0.42; }
.se-block.is-disabled { opacity: 0.5; }
.se-block.is-comment { background: hsl(214, 15%, 13%); border-style: dashed; border-left-style: solid; }
.se-block.flash-highlight { animation: blockFlash 1.1s ease; }
@keyframes blockFlash { 0%, 100% { box-shadow: var(--shadow-card); } 35% { box-shadow: 0 0 0 3px var(--amber), var(--shadow-card); } }

.se-block-header { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 8px 10px 6px 8px; }
.se-block-title-cluster { display: flex; align-items: center; gap: 6px; min-width: 0; }
.se-block-grip { display: inline-flex; color: var(--text-muted); cursor: grab; padding: 2px; }
.se-collapse-btn { width: 20px; height: 20px; display: inline-flex; align-items: center; justify-content: center; background: transparent; border: none; border-radius: 4px; color: var(--text-secondary); cursor: pointer; transition: transform 0.14s ease; }
.se-collapse-btn:hover { background: rgba(255,255,255,0.08); }
.se-collapse-btn.is-collapsed { transform: rotate(-90deg); }
.se-block-label { font-size: 13px; font-weight: 700; color: var(--text-primary); }
.se-muted-tag { font-size: 10px; font-weight: 800; letter-spacing: 0.06em; padding: 1px 5px; border-radius: 3px; background: rgba(255,255,255,0.08); color: var(--text-muted); }
.se-block-actions { display: flex; align-items: center; gap: 3px; opacity: 0.55; transition: opacity 0.12s ease; }
.se-block:hover > .se-block-header .se-block-actions, .se-block.is-selected > .se-block-header .se-block-actions { opacity: 1; }
.se-mini-pill { height: 22px; padding: 0 7px; margin-right: 3px; background: var(--bg-elevated); border: 1px solid var(--border-strong); border-radius: 4px; color: var(--text-secondary); font-family: var(--font-sans); font-size: 11px; font-weight: 600; cursor: pointer; }
.se-mini-pill:hover, .se-mini-pill.active { color: var(--text-primary); border-color: var(--amber); }
.se-icon-btn { width: 24px; height: 24px; display: inline-flex; align-items: center; justify-content: center; background: transparent; border: 1px solid transparent; border-radius: 4px; color: var(--text-secondary); cursor: pointer; }
.se-icon-btn:hover:not(:disabled) { background: rgba(255,255,255,0.08); color: var(--text-primary); }
.se-icon-btn.danger:hover:not(:disabled) { background: rgba(239,68,68,0.16); color: #fca5a5; }
.se-icon-btn:disabled { opacity: 0.28; cursor: default; }

.se-block-fields { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; padding: 2px 12px 10px 28px; }
.se-field { display: inline-flex; align-items: center; gap: 6px; }
.se-field-label { font-size: 11.5px; font-weight: 600; color: var(--text-secondary); white-space: nowrap; }
.se-field-boolean { padding: 3px 8px; background: var(--bg-input); border: 1px solid var(--border-subtle); border-radius: var(--radius-sm); cursor: pointer; }
.se-field-boolean input { accent-color: var(--amber); margin: 0; }
.se-input { height: 27px; padding: 0 8px; background: var(--bg-input); border: 1px solid var(--border-subtle); border-radius: var(--radius-sm); color: var(--text-primary); font-family: var(--font-sans); font-size: 12.5px; }
.se-input:hover { border-color: var(--border-strong); }
.se-input:focus { outline: none; border-color: var(--cyan); }
.se-field.w-sm .se-input { width: 96px; }
.se-field.w-md .se-input { width: 158px; }
.se-field .se-select { width: auto !important; min-width: 92px; max-width: 220px; }
.se-field.w-lg { flex: 1 1 220px; }
.se-field.w-lg .se-input { flex: 1; min-width: 170px; }
.se-number { font-family: var(--font-mono); }
.se-color-wrap { display: inline-flex; align-items: center; gap: 6px; height: 27px; padding: 0 7px 0 4px; background: var(--bg-input); border: 1px solid var(--border-subtle); border-radius: var(--radius-sm); }
.se-color-input { width: 20px; height: 19px; padding: 0; border: none; background: transparent; cursor: pointer; }
.se-color-hex { font-family: var(--font-mono); font-size: 11px; color: var(--text-secondary); }

.se-container-body { margin: 0 10px 6px 14px; padding: 6px 8px 6px 12px; background: hsl(214,20%,10.5%); border: 1px solid var(--border-subtle); border-left: 3px solid var(--block-color); border-radius: var(--radius-sm); }
.se-else-body { border-left-color: hsl(214, 15%, 45%); }
.se-branch-label { font-size: 10.5px; font-weight: 800; letter-spacing: 0.08em; color: var(--text-muted); margin-bottom: 4px; }
.se-else-label { color: hsl(35, 76%, 62%); }
.se-container-cap { height: 4px; }

.workspace-empty { margin-top: 40px; padding: 36px 28px; text-align: center; background: var(--bg-pane); border: 1px dashed var(--border-strong); border-radius: var(--radius-lg); }
.empty-kicker { font-size: 11px; font-weight: 800; letter-spacing: 0.1em; color: var(--amber); margin-bottom: 8px; }
.empty-title { margin: 0 0 8px; font-size: 18px; font-weight: 700; }
.empty-desc { margin: 0 auto 20px; max-width: 440px; color: var(--text-secondary); }
.empty-actions { display: flex; justify-content: center; flex-wrap: wrap; gap: 10px; }

/* Inspector */
.inspector-tabs { display: flex; flex-shrink: 0; border-bottom: 1px solid var(--border-subtle); background: hsl(214,19%,11%); }
.inspector-tab { flex: 1; height: 40px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; background: transparent; border: none; border-bottom: 2px solid transparent; color: var(--text-secondary); font-family: var(--font-sans); font-size: 12.5px; font-weight: 600; cursor: pointer; }
.inspector-tab:hover { color: var(--text-primary); background: rgba(255,255,255,0.03); }
.inspector-tab.active { color: var(--text-primary); border-bottom-color: var(--amber); background: var(--bg-pane); }
.tab-badge { font-size: 10.5px; font-weight: 700; font-family: var(--font-mono); padding: 1px 5px; border-radius: 99px; }
.tab-badge.ok { background: rgba(45,194,134,0.16); color: #5ce1a8; }
.tab-badge.warn { background: rgba(245,158,11,0.18); color: #fbbf24; }
.tab-badge.danger { background: rgba(239,68,68,0.2); color: #fca5a5; }
.tab-badge.neutral { background: rgba(255,255,255,0.08); color: var(--text-secondary); }
.inspector-body { flex: 1; min-height: 0; display: flex; flex-direction: column; overflow: hidden; }

.code-toolbar { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 9px 12px; border-bottom: 1px solid var(--border-subtle); flex-shrink: 0; }
.code-stats { display: flex; align-items: center; gap: 8px; min-width: 0; flex-wrap: wrap; }
.status-pill { font-size: 11px; font-weight: 700; padding: 2px 7px; border-radius: 4px; }
.status-pill.ok { background: rgba(45,194,134,0.15); color: #5ce1a8; }
.status-pill.danger { background: rgba(239,68,68,0.18); color: #fca5a5; }
.char-meter { font-family: var(--font-mono); font-size: 11px; color: var(--text-muted); }
.code-actions { display: flex; align-items: center; gap: 6px; }
.char-bar-track { height: 2px; background: var(--bg-input); flex-shrink: 0; }
.char-bar-fill { height: 100%; background: var(--cyan); }
.code-issues { padding: 8px 12px; background: rgba(245,158,11,0.08); border-bottom: 1px solid var(--border-subtle); display: flex; flex-direction: column; gap: 6px; flex-shrink: 0; }
.issue-row { display: flex; align-items: center; gap: 8px; font-size: 12px; }
.issue-tag { font-size: 10px; font-weight: 800; padding: 1px 5px; border-radius: 3px; background: rgba(245,158,11,0.22); color: #fcd34d; }
.issue-row.error .issue-tag { background: rgba(239,68,68,0.22); color: #fca5a5; }
.issue-msg { flex: 1; }
.issue-jump { background: var(--bg-elevated); border: 1px solid var(--border-strong); border-radius: 4px; color: var(--text-primary); font-size: 11px; padding: 2px 7px; cursor: pointer; }
.code-viewer { flex: 1; overflow: auto; padding: 10px 0 24px; background: hsl(215,24%,8.5%); font-family: var(--font-mono); font-size: 12px; line-height: 1.55; tab-size: 4; }
.code-line { display: flex; padding: 0 12px 0 0; }
.code-line:hover { background: rgba(255,255,255,0.03); }
.code-ln { flex: 0 0 38px; text-align: right; padding-right: 12px; color: hsl(214,12%,34%); user-select: none; }
.code-txt { white-space: pre; color: hsl(210,22%,88%); }
.tok-comment { color: hsl(213,13%,48%); font-style: italic; }
.tok-keyword { color: hsl(34,88%,65%); font-weight: 600; }
.tok-type { color: hsl(194,72%,66%); }
.tok-string { color: hsl(146,56%,64%); }
.tok-number { color: hsl(45,86%,70%); }

/* Simulator & Vector GUI Canvas */
.sim-layout { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 12px; }
.sim-output-section { display: flex; flex-direction: column; gap: 10px; }
.sim-lcd-bezel { background: hsl(215,22%,8%); border: 1px solid var(--border-strong); border-radius: var(--radius-md); overflow: hidden; box-shadow: var(--shadow-card); }
.sim-lcd-bar { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 6px 10px; background: hsl(214,18%,14%); border-bottom: 1px solid var(--border-subtle); }
.sim-lcd-bar-right { display: flex; align-items: center; gap: 8px; }
.sim-lcd-tag { font-size: 10px; font-weight: 800; letter-spacing: 0.09em; color: var(--cyan); }
.sim-lcd-name { font-size: 11.5px; font-family: var(--font-mono); color: var(--text-secondary); }
.sim-lcd-select { background: var(--bg-input); border: 1px solid var(--border-strong); border-radius: 4px; color: var(--text-primary); font-size: 11.5px; padding: 2px 6px; }
.sim-aspect-pills { display: inline-flex; background: var(--bg-input); border: 1px solid var(--border-subtle); border-radius: 4px; overflow: hidden; }
.sim-aspect-btn { padding: 2px 6px; background: transparent; border: none; color: var(--text-muted); font-family: var(--font-sans); font-size: 10.5px; font-weight: 600; cursor: pointer; }
.sim-aspect-btn:hover { color: var(--text-primary); }
.sim-aspect-btn.active { background: var(--bg-elevated); color: var(--amber); }
.sim-gui-stage { padding: 10px; background: #05090e; display: flex; align-items: center; justify-content: center; }
.sim-gui-canvas { display: block; width: 100%; height: auto; border-radius: 3px; }
.sim-gui-canvas.aspect-square { max-width: 340px; aspect-ratio: 1 / 1; }
.sim-gui-canvas.aspect-wide { max-width: 100%; aspect-ratio: 2 / 1; }

  /* ==================== C# 6.0 CODE GENERATOR (WITH MYSPRITE VECTOR GUI) ==================== */
  function escCs(s) { return String(s == null ? '' : s).replace(/\\/g, '\\\\').replace(/"/g, '\\"').replace(/\r/g, '').replace(/\n/g, '\\n'); }
  function hexRgb(hex) {
    var c = String(hex || '#FFFFFF').replace('#', '').trim();
    if (/^[0-9a-fA-F]{6}$/.test(c)) return { r: parseInt(c.slice(0, 2), 16), g: parseInt(c.slice(2, 4), 16), b: parseInt(c.slice(4, 6), 16) };
    return { r: 255, g: 255, b: 255 };
  }
  function colCs(hex, fb) { var r = hexRgb(hex || fb || '#38A3D1'); return 'new Color(' + r.r + ', ' + r.g + ', ' + r.b + ')'; }
  function nVal(v, fb) { var n = Number(v); return isFinite(n) ? n : (fb || 0); }
  function sVal(v, fb) { return v == null ? (fb || '') : String(v); }

  var CS_HELPERS = {
    grid: 'bool IsMyGrid(IMyTerminalBlock block)\n{\n    return !SAME_GRID_ONLY || Me.IsSameConstructAs(block);\n}',
    vars: 'double GetVar(string key)\n{\n    double val;\n    return _numVars.TryGetValue(key, out val) ? val : 0.0;\n}\n\nvoid SetVar(string key, double val)\n{\n    _numVars[key] = val;\n    _strVars[key] = val.ToString("0.#");\n}\n\nstring GetTextVar(string key)\n{\n    string val;\n    return _strVars.TryGetValue(key, out val) ? val : "";\n}\n\nvoid SetTextVar(string key, string val)\n{\n    _strVars[key] = val;\n}',
    bar: 'string BuildBar(double percent, int width)\n{\n    double clamped = Math.Max(0.0, Math.Min(100.0, percent));\n    int filled = (int)Math.Round((clamped / 100.0) * width);\n    return "[" + new string(\'#\', filled) + new string(\'-\', width - filled) + "]";\n}',
    format_num: 'string FormatAmount(double amount)\n{\n    if (amount >= 1000000.0) return (amount / 1000000.0).ToString("0.00") + "M";\n    if (amount >= 1000.0) return (amount / 1000.0).ToString("0.0") + "k";\n    if (Math.Abs(amount - Math.Round(amount)) < 0.05) return Math.Round(amount).ToString("0");\n    return amount.ToString("0.0");\n}',
    gui_core: 'IMyTextSurface GetGuiSurface(string name, int surfaceIndex, Color bgColor)\n{\n    IMyTerminalBlock block = GridTerminalSystem.GetBlockWithName(name);\n    if (block == null) { Echo("WARNING: Screen block not found -> " + name); return null; }\n    IMyTextSurface surf = block as IMyTextSurface;\n    if (surf == null)\n    {\n        IMyTextSurfaceProvider prov = block as IMyTextSurfaceProvider;\n        if (prov != null && prov.SurfaceCount > 0) surf = prov.GetSurface(Math.Max(0, Math.Min(surfaceIndex, prov.SurfaceCount - 1)));\n    }\n    if (surf == null) { Echo("WARNING: Block has no text surface -> " + name); return null; }\n    if (surf.ContentType != ContentType.SCRIPT) surf.ContentType = ContentType.SCRIPT;\n    if (surf.Script != "") surf.Script = "";\n    surf.ScriptBackgroundColor = bgColor;\n    return surf;\n}\n\nvoid GuiRect(MySpriteDrawFrame frame, float x, float y, float w, float h, Color color, float rot = 0f)\n{\n    frame.Add(new MySprite() { Type = SpriteType.TEXTURE, Data = "SquareSimple", Position = new Vector2(x + w * 0.5f, y + h * 0.5f), Size = new Vector2(w, h), Color = color, Alignment = TextAlignment.CENTER, RotationOrScale = rot });\n}\n\nvoid GuiSprite(MySpriteDrawFrame frame, string spriteId, float cx, float cy, float w, float h, Color color, float rot = 0f)\n{\n    frame.Add(new MySprite() { Type = SpriteType.TEXTURE, Data = spriteId, Position = new Vector2(cx, cy), Size = new Vector2(w, h), Color = color, Alignment = TextAlignment.CENTER, RotationOrScale = rot });\n}\n\nvoid GuiLabel(MySpriteDrawFrame frame, string text, float x, float y, float scale, Color color, TextAlignment align, string fontId = "White")\n{\n    frame.Add(new MySprite() { Type = SpriteType.TEXT, Data = text, Position = new Vector2(x, y), RotationOrScale = scale, Color = color, Alignment = align, FontId = fontId });\n}\n\nColor GuiAutoColor(double pct, string mode, Color customColor)\n{\n    if (mode == "custom") return customColor;\n    if (mode == "auto_high_bad") { if (pct >= 90.0) return new Color(239, 68, 68); if (pct >= 70.0) return new Color(245, 158, 11); return new Color(56, 217, 169); }\n    if (pct < 20.0) return new Color(239, 68, 68);\n    if (pct < 45.0) return new Color(245, 158, 11);\n    return new Color(34, 197, 94);\n}\n\nvoid GuiDrawBackdrop(MySpriteDrawFrame frame, RectangleF vp, Color accent, bool showFrame, bool showGrid)\n{\n    if (showGrid) GuiSprite(frame, "Grid", vp.Center.X, vp.Center.Y, vp.Width, vp.Height, new Color(accent.R, accent.G, accent.B, 24));\n    if (showFrame)\n    {\n        float pad = 5f;\n        Color edge = new Color(accent.R, accent.G, accent.B, 70);\n        GuiRect(frame, vp.X + pad, vp.Y + pad, vp.Width - pad * 2f, 2f, edge);\n        GuiRect(frame, vp.X + pad, vp.Y + vp.Height - pad - 2f, vp.Width - pad * 2f, 2f, edge);\n        GuiRect(frame, vp.X + pad, vp.Y + pad, 2f, vp.Height - pad * 2f, edge);\n        GuiRect(frame, vp.X + vp.Width - pad - 2f, vp.Y + pad, 2f, vp.Height - pad * 2f, edge);\n    }\n}',
    gui_header: 'void GuiDrawHeader(MySpriteDrawFrame frame, RectangleF vp, ref float y, string title, string badge, Color accent)\n{\n    float s = Math.Max(0.55f, Math.Min(vp.Width, vp.Height) / 512f);\n    float pad = Math.Max(14f, vp.Width * 0.04f);\n    float w = vp.Width - pad * 2f, h = 44f * s;\n    GuiRect(frame, vp.X + pad, y, w, h, new Color(18, 29, 42, 230));\n    GuiRect(frame, vp.X + pad, y, 5f * s, h, accent);\n    GuiRect(frame, vp.X + pad, y + h - 2f, w, 2f, new Color(accent.R, accent.G, accent.B, 90));\n    GuiLabel(frame, title, vp.X + pad + 14f * s, y + 9f * s, 0.92f * s, new Color(236, 242, 248), TextAlignment.LEFT);\n    if (!string.IsNullOrEmpty(badge))\n    {\n        float bw = Math.Max(82f * s, (badge.Length * 11.5f + 22f) * s), bh = 24f * s;\n        float bx = vp.X + pad + w - bw - 10f * s, by = y + (h - bh) * 0.5f;\n        GuiRect(frame, bx, by, bw, bh, new Color(accent.R, accent.G, accent.B, 42));\n        GuiLabel(frame, badge, bx + bw * 0.5f, by + 3f * s, 0.65f * s, accent, TextAlignment.CENTER);\n    }\n    y += h + 12f * s;\n}',
    gui_bar: 'void GuiDrawBar(MySpriteDrawFrame frame, RectangleF vp, ref float y, string label, double percent, string style, string icon, string colorMode, Color customColor)\n{\n    float s = Math.Max(0.55f, Math.Min(vp.Width, vp.Height) / 512f);\n    float pad = Math.Max(14f, vp.Width * 0.04f), w = vp.Width - pad * 2f;\n    double pct = Math.Max(0.0, Math.Min(100.0, percent));\n    Color fill = GuiAutoColor(pct, colorMode, customColor);\n    string pctText = pct.ToString("0") + "%";\n    string ico = icon == "energy" ? "IconEnergy" : icon == "hydrogen" ? "IconHydrogen" : icon == "oxygen" ? "IconOxygen" : icon == "cargo" ? "Construction" : icon == "danger" ? "Danger" : "";\n    if (style == "compact")\n    {\n        float h = 26f * s, labelW = Math.Min(120f * s, w * 0.30f), valW = 54f * s;\n        float barX = vp.X + pad + labelW, barW = Math.Max(40f, w - labelW - valW), barH = 12f * s, barY = y + (h - barH) * 0.5f;\n        float tx = vp.X + pad;\n        if (ico != "") { GuiSprite(frame, ico, tx + 8f * s, y + h * 0.5f, 16f * s, 16f * s, fill); tx += 20f * s; }\n        GuiLabel(frame, label, tx, y + 4f * s, 0.68f * s, new Color(205, 218, 232), TextAlignment.LEFT);\n        GuiRect(frame, barX, barY, barW, barH, new Color(24, 35, 48));\n        float fw = (float)(barW * (pct / 100.0));\n        if (fw > 1f) GuiRect(frame, barX, barY, fw, barH, fill);\n        GuiLabel(frame, pctText, vp.X + pad + w, y + 4f * s, 0.70f * s, fill, TextAlignment.RIGHT);\n        y += h + 7f * s; return;\n    }\n    float tx2 = vp.X + pad;\n    if (ico != "") { GuiSprite(frame, ico, tx2 + 9f * s, y + 10f * s, 18f * s, 18f * s, fill); tx2 += 24f * s; }\n    GuiLabel(frame, label, tx2, y, 0.72f * s, new Color(214, 224, 235), TextAlignment.LEFT);\n    GuiLabel(frame, pctText, vp.X + pad + w, y, 0.76f * s, fill, TextAlignment.RIGHT);\n    float barTop = y + 23f * s, barH2 = 22f * s, ip = 3f * s;\n    GuiRect(frame, vp.X + pad, barTop, w, barH2, new Color(18, 28, 40));\n    if (style == "segmented")\n    {\n        int segs = 20, lit = (int)Math.Round((pct / 100.0) * segs);\n        float gap = 3f * s, segW = (w - ip * 2f - gap * (segs - 1)) / segs;\n        for (int i = 0; i < segs; i++) GuiRect(frame, vp.X + pad + ip + i * (segW + gap), barTop + ip, segW, barH2 - ip * 2f, i < lit ? fill : new Color(34, 47, 62));\n    }\n    else\n    {\n        float iw = w - ip * 2f, fw = (float)(iw * (pct / 100.0));\n        if (fw > 1f) { GuiRect(frame, vp.X + pad + ip, barTop + ip, fw, barH2 - ip * 2f, fill); GuiRect(frame, vp.X + pad + ip + Math.Max(0f, fw - 3f * s), barTop + ip, Math.Min(3f * s, fw), barH2 - ip * 2f, new Color(255, 255, 255, 190)); }\n        for (int q = 1; q <= 3; q++) GuiRect(frame, vp.X + pad + ip + iw * (q * 0.25f), barTop + ip, 1.5f, barH2 - ip * 2f, new Color(8, 17, 26, 150));\n    }\n    y = barTop + barH2 + 12f * s;\n}',
    gui_gauges: 'void GuiDrawGauges(MySpriteDrawFrame frame, RectangleF vp, ref float y, string[] labels, double[] values)\n{\n    int count = Math.Min(labels.Length, values.Length);\n    if (count <= 0) return;\n    float s = Math.Max(0.55f, Math.Min(vp.Width, vp.Height) / 512f);\n    float pad = Math.Max(14f, vp.Width * 0.04f), cellW = (vp.Width - pad * 2f) / count;\n    float radius = Math.Min(cellW * 0.36f, 54f * s), cy = y + radius + 12f * s;\n    int segs = 24;\n    for (int idx = 0; idx < count; idx++)\n    {\n        float cx = vp.X + pad + cellW * (idx + 0.5f);\n        double pct = Math.Max(0.0, Math.Min(100.0, values[idx]));\n        Color col = GuiAutoColor(pct, "auto", new Color(56, 217, 169));\n        int lit = (int)Math.Round((pct / 100.0) * segs);\n        for (int i = 0; i < segs; i++)\n        {\n            double rad = (135.0 + (270.0 * i) / (segs - 1)) * Math.PI / 180.0;\n            GuiSprite(frame, "SquareSimple", cx + (float)(Math.Cos(rad) * radius), cy + (float)(Math.Sin(rad) * radius), 9f * s, 5.5f * s, i < lit ? col : new Color(34, 47, 62), (float)(rad + Math.PI * 0.5));\n        }\n        GuiLabel(frame, pct.ToString("0") + "%", cx, cy - 15f * s, 0.95f * s, new Color(240, 245, 250), TextAlignment.CENTER);\n        GuiLabel(frame, labels[idx], cx, cy + radius * 0.52f, 0.58f * s, new Color(150, 170, 190), TextAlignment.CENTER);\n    }\n    y = cy + radius + 18f * s;\n}',
    gui_metrics: 'void GuiDrawMetrics(MySpriteDrawFrame frame, RectangleF vp, ref float y, Color accent, string[] labels, string[] values)\n{\n    int count = Math.Min(labels.Length, values.Length);\n    if (count <= 0) return;\n    float s = Math.Max(0.55f, Math.Min(vp.Width, vp.Height) / 512f);\n    float pad = Math.Max(14f, vp.Width * 0.04f), gap = 10f * s, cardW = (vp.Width - pad * 2f - gap * (count - 1)) / count, cardH = 62f * s;\n    for (int i = 0; i < count; i++)\n    {\n        float cx = vp.X + pad + i * (cardW + gap);\n        GuiRect(frame, cx, y, cardW, cardH, new Color(18, 29, 42, 230));\n        GuiRect(frame, cx, y, cardW, 3f * s, accent);\n        GuiLabel(frame, labels[i], cx + cardW * 0.5f, y + 9f * s, 0.56f * s, new Color(142, 162, 182), TextAlignment.CENTER);\n        GuiLabel(frame, values[i], cx + cardW * 0.5f, y + 29f * s, 0.85f * s, new Color(238, 244, 250), TextAlignment.CENTER);\n    }\n    y += cardH + 12f * s;\n}',
    gui_alert: 'void GuiDrawAlert(MySpriteDrawFrame frame, RectangleF vp, ref float y, string severity, string message)\n{\n    float s = Math.Max(0.55f, Math.Min(vp.Width, vp.Height) / 512f);\n    float pad = Math.Max(14f, vp.Width * 0.04f), w = vp.Width - pad * 2f, h = 36f * s;\n    Color accent = severity == "critical" ? new Color(239, 68, 68) : severity == "warning" ? new Color(245, 158, 11) : severity == "nominal" ? new Color(34, 197, 94) : new Color(56, 189, 248);\n    GuiRect(frame, vp.X + pad, y, w, h, new Color(accent.R, accent.G, accent.B, 42));\n    GuiRect(frame, vp.X + pad, y, 5f * s, h, accent);\n    string spr = (severity == "critical" || severity == "warning") ? "Danger" : "Circle";\n    float icoSize = (severity == "critical" || severity == "warning") ? 20f * s : 11f * s;\n    GuiSprite(frame, spr, vp.X + pad + 20f * s, y + h * 0.5f, icoSize, icoSize, accent);\n    GuiLabel(frame, message, vp.X + pad + 36f * s, y + 8f * s, 0.72f * s, new Color(245, 248, 252), TextAlignment.LEFT);\n    y += h + 9f * s;\n}',
    gui_inventory: 'void GuiDrawInventory(MySpriteDrawFrame frame, RectangleF vp, ref float y, string category, string sortBy, int maxItems, Color accent, string nameFilter)\n{\n    List<IMyTerminalBlock> blocks = new List<IMyTerminalBlock>();\n    GridTerminalSystem.GetBlocksOfType<IMyTerminalBlock>(blocks, delegate(IMyTerminalBlock b) { return b.HasInventory && IsMyGrid(b) && (string.IsNullOrEmpty(nameFilter) || b.CustomName.IndexOf(nameFilter, StringComparison.OrdinalIgnoreCase) >= 0); });\n    Dictionary<string, double> totals = new Dictionary<string, double>();\n    List<MyInventoryItem> items = new List<MyInventoryItem>();\n    double usedVol = 0.0, maxVol = 0.0;\n    for (int i = 0; i < blocks.Count; i++)\n    {\n        for (int invIdx = 0; invIdx < blocks[i].InventoryCount; invIdx++)\n        {\n            IMyInventory inv = blocks[i].GetInventory(invIdx);\n            usedVol += (double)inv.CurrentVolume; maxVol += (double)inv.MaxVolume;\n            items.Clear(); inv.GetItems(items);\n            for (int k = 0; k < items.Count; k++)\n            {\n                MyInventoryItem item = items[k]; string tid = item.Type.TypeId;\n                bool isOre = tid.IndexOf("Ore", StringComparison.OrdinalIgnoreCase) >= 0, isIngot = tid.IndexOf("Ingot", StringComparison.OrdinalIgnoreCase) >= 0, isComp = tid.IndexOf("Component", StringComparison.OrdinalIgnoreCase) >= 0, isAmmo = tid.IndexOf("Ammo", StringComparison.OrdinalIgnoreCase) >= 0 || tid.IndexOf("Gun", StringComparison.OrdinalIgnoreCase) >= 0;\n                if ((category == "ore" && !isOre) || (category == "ingot" && !isIngot) || (category == "component" && !isComp) || (category == "ammo" && !isAmmo) || (category == "ore_ingot" && !isOre && !isIngot)) continue;\n                string label = item.Type.SubtypeId + (isOre ? " (Ore)" : (isIngot ? " (Ingot)" : ""));\n                double ex; totals[label] = totals.TryGetValue(label, out ex) ? ex + (double)item.Amount : (double)item.Amount;\n            }\n        }\n    }\n    GuiDrawBar(frame, vp, ref y, "CARGO CAPACITY", maxVol > 0.0 ? (usedVol / maxVol) * 100.0 : 0.0, "segmented", "cargo", "auto_high_bad", accent);\n    List<KeyValuePair<string, double>> sorted = new List<KeyValuePair<string, double>>(totals);\n    if (sortBy == "name_asc") sorted.Sort(delegate(KeyValuePair<string, double> a, KeyValuePair<string, double> b) { return string.Compare(a.Key, b.Key, StringComparison.OrdinalIgnoreCase); });\n    else sorted.Sort(delegate(KeyValuePair<string, double> a, KeyValuePair<string, double> b) { return b.Value.CompareTo(a.Value); });\n    float s = Math.Max(0.55f, Math.Min(vp.Width, vp.Height) / 512f), pad = Math.Max(14f, vp.Width * 0.04f), w = vp.Width - pad * 2f, rowH = 26f * s;\n    double topVal = sorted.Count > 0 ? Math.Max(1.0, sorted[0].Value) : 1.0;\n    int count = Math.Min(maxItems, sorted.Count);\n    for (int i = 0; i < count; i++)\n    {\n        GuiRect(frame, vp.X + pad, y, w, rowH, (i % 2 == 0) ? new Color(18, 28, 40, 210) : new Color(13, 21, 31, 180));\n        GuiRect(frame, vp.X + pad, y + rowH - 3f * s, w * (float)Math.Min(1.0, sorted[i].Value / topVal), 3f * s, new Color(accent.R, accent.G, accent.B, 165));\n        string nm = sorted[i].Key.Length > 22 ? sorted[i].Key.Substring(0, 22) : sorted[i].Key;\n        GuiLabel(frame, nm, vp.X + pad + 8f * s, y + 3f * s, 0.66f * s, new Color(224, 232, 240), TextAlignment.LEFT);\n        GuiLabel(frame, FormatAmount(sorted[i].Value), vp.X + pad + w - 8f * s, y + 3f * s, 0.68f * s, accent, TextAlignment.RIGHT);\n        y += rowH + 4f * s;\n    }\n}',
    gui_text: 'void GuiDrawText(MySpriteDrawFrame frame, RectangleF vp, ref float y, string text, string size, TextAlignment align, Color color)\n{\n    float s = Math.Max(0.55f, Math.Min(vp.Width, vp.Height) / 512f), pad = Math.Max(14f, vp.Width * 0.04f);\n    float scale = size == "heading" ? 0.95f * s : size == "caption" ? 0.58f * s : 0.74f * s;\n    float x = align == TextAlignment.CENTER ? vp.Center.X : align == TextAlignment.RIGHT ? (vp.X + vp.Width - pad) : (vp.X + pad);\n    GuiLabel(frame, text, x, y, scale, color, align);\n    y += (size == "heading" ? 32f : size == "caption" ? 20f : 26f) * s;\n}',
    gui_divider: 'void GuiDrawDivider(MySpriteDrawFrame frame, RectangleF vp, ref float y, string label, Color color)\n{\n    float s = Math.Max(0.55f, Math.Min(vp.Width, vp.Height) / 512f), pad = Math.Max(14f, vp.Width * 0.04f), w = vp.Width - pad * 2f;\n    if (string.IsNullOrEmpty(label)) { GuiRect(frame, vp.X + pad, y + 4f * s, w, 2f, color); y += 12f * s; }\n    else { GuiLabel(frame, label, vp.X + pad, y, 0.56f * s, color, TextAlignment.LEFT); float lw = Math.Min(w * 0.55f, (label.Length * 9f + 10f) * s); GuiRect(frame, vp.X + pad + lw, y + 9f * s, Math.Max(10f, w - lw), 2f, new Color(color.R, color.G, color.B, 140)); y += 22f * s; }\n}',
    lcd_core: 'IMyTextPanel GetLcd(string name)\n{\n    IMyTextPanel lcd = GridTerminalSystem.GetBlockWithName(name) as IMyTextPanel;\n    if (lcd == null) { Echo("WARNING: LCD not found -> " + name); return null; }\n    if (lcd.ContentType != ContentType.TEXT_AND_IMAGE) lcd.ContentType = ContentType.TEXT_AND_IMAGE;\n    return lcd;\n}\n\nvoid WriteToLcd(string name, string text, bool append)\n{\n    IMyTextPanel lcd = GetLcd(name);\n    if (lcd != null) lcd.WriteText(text, append);\n}',
    lcd_style: 'void StyleLcd(string name, string font, float fontSize, Color fontColor, Color bgColor, TextAlignment align)\n{\n    IMyTextPanel lcd = GetLcd(name);\n    if (lcd == null) return;\n    lcd.Font = font; lcd.FontSize = fontSize; lcd.FontColor = fontColor; lcd.BackgroundColor = bgColor; lcd.Alignment = align;\n}',
    lcd_inventory: 'void ShowInventoryOnLcd(string lcdName, string title, string category, string sortBy, bool showBar, int maxItems, string nameFilter)\n{\n    IMyTextPanel lcd = GetLcd(lcdName); if (lcd == null) return;\n    List<IMyTerminalBlock> blocks = new List<IMyTerminalBlock>();\n    GridTerminalSystem.GetBlocksOfType<IMyTerminalBlock>(blocks, delegate(IMyTerminalBlock b) { return b.HasInventory && IsMyGrid(b) && (string.IsNullOrEmpty(nameFilter) || b.CustomName.IndexOf(nameFilter, StringComparison.OrdinalIgnoreCase) >= 0); });\n    Dictionary<string, double> totals = new Dictionary<string, double>(); List<MyInventoryItem> items = new List<MyInventoryItem>(); double usedVol = 0.0, maxVol = 0.0;\n    for (int i = 0; i < blocks.Count; i++) for (int invIdx = 0; invIdx < blocks[i].InventoryCount; invIdx++) { IMyInventory inv = blocks[i].GetInventory(invIdx); usedVol += (double)inv.CurrentVolume; maxVol += (double)inv.MaxVolume; items.Clear(); inv.GetItems(items); for (int k = 0; k < items.Count; k++) { MyInventoryItem item = items[k]; string tid = item.Type.TypeId; bool isOre = tid.IndexOf("Ore", StringComparison.OrdinalIgnoreCase) >= 0, isIngot = tid.IndexOf("Ingot", StringComparison.OrdinalIgnoreCase) >= 0, isComp = tid.IndexOf("Component", StringComparison.OrdinalIgnoreCase) >= 0, isAmmo = tid.IndexOf("Ammo", StringComparison.OrdinalIgnoreCase) >= 0 || tid.IndexOf("Gun", StringComparison.OrdinalIgnoreCase) >= 0; if ((category == "ore" && !isOre) || (category == "ingot" && !isIngot) || (category == "component" && !isComp) || (category == "ammo" && !isAmmo) || (category == "ore_ingot" && !isOre && !isIngot)) continue; string lbl = item.Type.SubtypeId + (isOre ? " (Ore)" : (isIngot ? " (Ingot)" : "")); double ex; totals[lbl] = totals.TryGetValue(lbl, out ex) ? ex + (double)item.Amount : (double)item.Amount; } }\n    List<KeyValuePair<string, double>> sorted = new List<KeyValuePair<string, double>>(totals);\n    if (sortBy == "name_asc") sorted.Sort(delegate(KeyValuePair<string, double> a, KeyValuePair<string, double> b) { return string.Compare(a.Key, b.Key, StringComparison.OrdinalIgnoreCase); }); else sorted.Sort(delegate(KeyValuePair<string, double> a, KeyValuePair<string, double> b) { return b.Value.CompareTo(a.Value); });\n    StringBuilder sb = new StringBuilder(); sb.AppendLine("=== " + title + " ===");\n    if (showBar) { double pct = maxVol > 0.0 ? (usedVol / maxVol) * 100.0 : 0.0; sb.AppendLine("Cargo: " + BuildBar(pct, 16) + " " + pct.ToString("0.0") + "%"); }\n    sb.AppendLine("--------------------------------");\n    if (sorted.Count == 0) sb.AppendLine("  (No matching items found)"); else { int count = Math.Min(maxItems, sorted.Count); for (int i = 0; i < count; i++) { string nm = sorted[i].Key.Length > 21 ? sorted[i].Key.Substring(0, 21) : sorted[i].Key; sb.AppendLine(nm.PadRight(22) + FormatAmount(sorted[i].Value).PadLeft(10)); } }\n    lcd.WriteText(sb.ToString(), false);\n}',
    lcd_power: 'void ShowPowerOnLcd(string lcdName, string title, bool showSources, bool showBar, bool append)\n{\n    IMyTextPanel lcd = GetLcd(lcdName); if (lcd == null) return;\n    List<IMyBatteryBlock> batts = new List<IMyBatteryBlock>(); GridTerminalSystem.GetBlocksOfType<IMyBatteryBlock>(batts, IsMyGrid);\n    double stored = 0.0, maxStored = 0.0, curIn = 0.0, curOut = 0.0;\n    for (int i = 0; i < batts.Count; i++) { stored += batts[i].CurrentStoredPower; maxStored += batts[i].MaxStoredPower; curIn += batts[i].CurrentInput; curOut += batts[i].CurrentOutput; }\n    double pct = maxStored > 0.0 ? (stored / maxStored) * 100.0 : 0.0;\n    StringBuilder sb = new StringBuilder(); sb.AppendLine("=== " + title + " ===");\n    sb.AppendLine(showBar ? ("Batt:  " + BuildBar(pct, 16) + " " + pct.ToString("0.0") + "%") : ("Batteries (" + batts.Count + "): " + pct.ToString("0.0") + "%"));\n    sb.AppendLine("Stored: " + stored.ToString("0.00") + " / " + maxStored.ToString("0.00") + " MWh");\n    sb.AppendLine("Flow:   +" + curIn.ToString("0.00") + " MW / -" + curOut.ToString("0.00") + " MW");\n    if (showSources) { List<IMySolarPanel> solars = new List<IMySolarPanel>(); GridTerminalSystem.GetBlocksOfType<IMySolarPanel>(solars, IsMyGrid); double sOut = 0.0; for (int i = 0; i < solars.Count; i++) sOut += solars[i].CurrentOutput; List<IMyReactor> reacts = new List<IMyReactor>(); GridTerminalSystem.GetBlocksOfType<IMyReactor>(reacts, IsMyGrid); double rOut = 0.0; for (int i = 0; i < reacts.Count; i++) rOut += reacts[i].CurrentOutput; sb.AppendLine("Solar:  " + sOut.ToString("0.00") + " MW (" + solars.Count + ")"); sb.AppendLine("React:  " + rOut.ToString("0.00") + " MW (" + reacts.Count + ")"); }\n    lcd.WriteText(sb.ToString(), append);\n}',
    lcd_gas: 'void ShowGasOnLcd(string lcdName, string title, string gasType, bool showBar, bool append)\n{\n    IMyTextPanel lcd = GetLcd(lcdName); if (lcd == null) return;\n    List<IMyGasTank> tanks = new List<IMyGasTank>(); GridTerminalSystem.GetBlocksOfType<IMyGasTank>(tanks, IsMyGrid);\n    double h2F = 0.0, h2C = 0.0, o2F = 0.0, o2C = 0.0; int h2N = 0, o2N = 0;\n    for (int i = 0; i < tanks.Count; i++) { bool isH2 = tanks[i].BlockDefinition.SubtypeId.IndexOf("Hydrogen", StringComparison.OrdinalIgnoreCase) >= 0; if (isH2) { h2F += tanks[i].FilledRatio * tanks[i].Capacity; h2C += tanks[i].Capacity; h2N++; } else { o2F += tanks[i].FilledRatio * tanks[i].Capacity; o2C += tanks[i].Capacity; o2N++; } }\n    StringBuilder sb = new StringBuilder(); sb.AppendLine("=== " + title + " ===");\n    if (gasType == "both" || gasType == "hydrogen") { double p = h2C > 0.0 ? (h2F / h2C) * 100.0 : 0.0; sb.AppendLine("H2 (" + h2N + "): " + (showBar ? BuildBar(p, 14) + " " : "") + p.ToString("0.0") + "%"); }\n    if (gasType == "both" || gasType == "oxygen") { double p = o2C > 0.0 ? (o2F / o2C) * 100.0 : 0.0; sb.AppendLine("O2 (" + o2N + "): " + (showBar ? BuildBar(p, 14) + " " : "") + p.ToString("0.0") + "%"); }\n    lcd.WriteText(sb.ToString(), append);\n}',
    battery_pct: 'double GetBatteryPercent(string filter)\n{\n    List<IMyBatteryBlock> batts = new List<IMyBatteryBlock>(); GridTerminalSystem.GetBlocksOfType<IMyBatteryBlock>(batts, delegate(IMyBatteryBlock b) { return IsMyGrid(b) && (string.IsNullOrEmpty(filter) || b.CustomName.IndexOf(filter, StringComparison.OrdinalIgnoreCase) >= 0); });\n    double s = 0.0, m = 0.0; for (int i = 0; i < batts.Count; i++) { s += batts[i].CurrentStoredPower; m += batts[i].MaxStoredPower; }\n    return m > 0.0 ? (s / m) * 100.0 : 0.0;\n}',
    gas_pct: 'double GetGasPercent(bool hydrogen, string filter)\n{\n    List<IMyGasTank> tanks = new List<IMyGasTank>(); GridTerminalSystem.GetBlocksOfType<IMyGasTank>(tanks, delegate(IMyGasTank t) { if (!IsMyGrid(t)) return false; bool isH2 = t.BlockDefinition.SubtypeId.IndexOf("Hydrogen", StringComparison.OrdinalIgnoreCase) >= 0; return isH2 == hydrogen && (string.IsNullOrEmpty(filter) || t.CustomName.IndexOf(filter, StringComparison.OrdinalIgnoreCase) >= 0); });\n    double f = 0.0, c = 0.0; for (int i = 0; i < tanks.Count; i++) { f += tanks[i].FilledRatio * tanks[i].Capacity; c += tanks[i].Capacity; }\n    return c > 0.0 ? (f / c) * 100.0 : 0.0;\n}',
    cargo_pct: 'double GetCargoPercent(string filter)\n{\n    List<IMyCargoContainer> cargos = new List<IMyCargoContainer>(); GridTerminalSystem.GetBlocksOfType<IMyCargoContainer>(cargos, delegate(IMyCargoContainer c) { return IsMyGrid(c) && (string.IsNullOrEmpty(filter) || c.CustomName.IndexOf(filter, StringComparison.OrdinalIgnoreCase) >= 0); });\n    double u = 0.0, m = 0.0; for (int i = 0; i < cargos.Count; i++) { IMyInventory inv = cargos[i].GetInventory(0); u += (double)inv.CurrentVolume; m += (double)inv.MaxVolume; }\n    return m > 0.0 ? (u / m) * 100.0 : 0.0;\n}',
    vent_o2: 'double GetVentOxygenPercent(string name)\n{\n    IMyAirVent vent = GridTerminalSystem.GetBlockWithName(name) as IMyAirVent;\n    if (vent == null) { Echo("WARNING: Air Vent not found -> " + name); return 0.0; }\n    return vent.GetOxygenLevel() * 100.0;\n}',
    ship_speed: 'double GetShipSpeed()\n{\n    List<IMyShipController> ctrls = new List<IMyShipController>(); GridTerminalSystem.GetBlocksOfType<IMyShipController>(ctrls, IsMyGrid);\n    return ctrls.Count > 0 ? ctrls[0].GetShipSpeed() : 0.0;\n}',
    gravity_g: 'double GetGravityG()\n{\n    List<IMyShipController> ctrls = new List<IMyShipController>(); GridTerminalSystem.GetBlocksOfType<IMyShipController>(ctrls, IsMyGrid);\n    return ctrls.Count > 0 ? ctrls[0].GetNaturalGravity().Length() / 9.81 : 0.0;\n}',
    solar_mw: 'double GetSolarOutputMW()\n{\n    List<IMySolarPanel> list = new List<IMySolarPanel>(); GridTerminalSystem.GetBlocksOfType<IMySolarPanel>(list, IsMyGrid);\n    double sum = 0.0; for (int i = 0; i < list.Count; i++) sum += list[i].CurrentOutput;\n    return sum;\n}',
    reactor_mw: 'double GetReactorOutputMW()\n{\n    List<IMyReactor> list = new List<IMyReactor>(); GridTerminalSystem.GetBlocksOfType<IMyReactor>(list, IsMyGrid);\n    double sum = 0.0; for (int i = 0; i < list.Count; i++) sum += list[i].CurrentOutput;\n    return sum;\n}',
    projector_remaining: 'int GetProjectorRemaining(string name)\n{\n    IMyProjector proj = GridTerminalSystem.GetBlockWithName(name) as IMyProjector;\n    return proj != null ? proj.RemainingBlocks : 0;\n}',
    item_count: 'double GetItemCount(string typeId, string subtypeId)\n{\n    List<IMyTerminalBlock> blocks = new List<IMyTerminalBlock>(); GridTerminalSystem.GetBlocksOfType<IMyTerminalBlock>(blocks, delegate(IMyTerminalBlock b) { return b.HasInventory && IsMyGrid(b); });\n    double total = 0.0; MyItemType itemType = new MyItemType(typeId, subtypeId);\n    for (int i = 0; i < blocks.Count; i++) for (int j = 0; j < blocks[i].InventoryCount; j++) total += (double)blocks[i].GetInventory(j).GetItemAmount(itemType);\n    return total;\n}',
    door_open: 'bool IsDoorOpen(string name) { IMyDoor d = GridTerminalSystem.GetBlockWithName(name) as IMyDoor; return d != null && (d.Status == DoorStatus.Open || d.Status == DoorStatus.Opening); }',
    connector_state: 'bool IsConnectorStatus(string name, MyShipConnectorStatus expected) { IMyShipConnector c = GridTerminalSystem.GetBlockWithName(name) as IMyShipConnector; if (c == null) { Echo("WARNING: Connector not found -> " + name); return false; } return c.Status == expected; }',
    sensor_active: 'bool IsSensorActive(string name) { IMySensorBlock s = GridTerminalSystem.GetBlockWithName(name) as IMySensorBlock; return s != null && s.IsActive; }',
    turret_target: 'bool AnyTurretHasTarget(string filter) { List<IMyLargeTurretBase> list = new List<IMyLargeTurretBase>(); GridTerminalSystem.GetBlocksOfType<IMyLargeTurretBase>(list, delegate(IMyLargeTurretBase t) { return IsMyGrid(t) && (string.IsNullOrEmpty(filter) || t.CustomName.IndexOf(filter, StringComparison.OrdinalIgnoreCase) >= 0); }); for (int i = 0; i < list.Count; i++) if (list[i].HasTarget) return true; return false; }',
    block_enabled: 'bool IsBlockEnabled(string name) { IMyFunctionalBlock fb = GridTerminalSystem.GetBlockWithName(name) as IMyFunctionalBlock; return fb != null && fb.Enabled; }',
    door_action: 'void ControlDoors(string mode, string name, string action)\n{\n    List<IMyDoor> doors = new List<IMyDoor>();\n    if (mode == "group") { IMyBlockGroup grp = GridTerminalSystem.GetBlockGroupWithName(name); if (grp != null) grp.GetBlocksOfType<IMyDoor>(doors, IsMyGrid); }\n    else if (mode == "tag") GridTerminalSystem.GetBlocksOfType<IMyDoor>(doors, delegate(IMyDoor d) { return IsMyGrid(d) && d.CustomName.IndexOf(name, StringComparison.OrdinalIgnoreCase) >= 0; });\n    else { IMyDoor single = GridTerminalSystem.GetBlockWithName(name) as IMyDoor; if (single != null) doors.Add(single); }\n    if (doors.Count == 0) { Echo("WARNING: Door(s) not found -> " + name); return; }\n    for (int i = 0; i < doors.Count; i++) { IMyDoor d = doors[i]; if (action == "open") { d.Enabled = true; d.OpenDoor(); } else if (action == "close") { d.Enabled = true; d.CloseDoor(); } else if (action == "toggle") { d.Enabled = true; d.ToggleDoor(); } else if (action == "lock") { d.CloseDoor(); if (d.Status == DoorStatus.Closed) d.Enabled = false; } else if (action == "unlock") d.Enabled = true; }\n}',
    airvent_action: 'void ControlAirVent(string name, string action) { IMyAirVent v = GridTerminalSystem.GetBlockWithName(name) as IMyAirVent; if (v == null) { Echo("WARNING: Air Vent not found -> " + name); return; } if (action == "pressurize") { v.Enabled = true; v.Depressurize = false; } else if (action == "depressurize") { v.Enabled = true; v.Depressurize = true; } else if (action == "on") v.Enabled = true; else if (action == "off") v.Enabled = false; }',
    light_action: 'void ControlLights(string mode, string name, string action, Color color, float blinkSeconds)\n{\n    List<IMyLightingBlock> lights = new List<IMyLightingBlock>();\n    if (mode == "all") GridTerminalSystem.GetBlocksOfType<IMyLightingBlock>(lights, IsMyGrid);\n    else if (mode == "group") { IMyBlockGroup grp = GridTerminalSystem.GetBlockGroupWithName(name); if (grp != null) grp.GetBlocksOfType<IMyLightingBlock>(lights, IsMyGrid); }\n    else { IMyLightingBlock single = GridTerminalSystem.GetBlockWithName(name) as IMyLightingBlock; if (single != null) lights.Add(single); }\n    for (int i = 0; i < lights.Count; i++) { IMyLightingBlock l = lights[i]; if (action == "on") l.Enabled = true; else if (action == "off") l.Enabled = false; else if (action == "toggle") l.Enabled = !l.Enabled; else if (action == "style") { l.Enabled = true; l.Color = color; l.BlinkIntervalSeconds = blinkSeconds; l.BlinkLength = blinkSeconds > 0f ? 50f : 100f; } }\n}',
    block_power: 'void SetBlockPower(string mode, string name, string action)\n{\n    List<IMyFunctionalBlock> list = new List<IMyFunctionalBlock>();\n    if (mode == "group") { IMyBlockGroup grp = GridTerminalSystem.GetBlockGroupWithName(name); if (grp != null) grp.GetBlocksOfType<IMyFunctionalBlock>(list, IsMyGrid); }\n    else if (mode == "tag") GridTerminalSystem.GetBlocksOfType<IMyFunctionalBlock>(list, delegate(IMyFunctionalBlock b) { return IsMyGrid(b) && b.CustomName.IndexOf(name, StringComparison.OrdinalIgnoreCase) >= 0; });\n    else { IMyFunctionalBlock single = GridTerminalSystem.GetBlockWithName(name) as IMyFunctionalBlock; if (single != null) list.Add(single); }\n    if (list.Count == 0) { Echo("WARNING: Block(s) not found -> " + name); return; }\n    for (int i = 0; i < list.Count; i++) { if (action == "on") list[i].Enabled = true; else if (action == "off") list[i].Enabled = false; else list[i].Enabled = !list[i].Enabled; }\n}',
    battery_mode: 'void SetBatteryMode(string mode, string name, ChargeMode chargeMode) { List<IMyBatteryBlock> batts = new List<IMyBatteryBlock>(); if (mode == "all") GridTerminalSystem.GetBlocksOfType<IMyBatteryBlock>(batts, IsMyGrid); else if (mode == "group") { IMyBlockGroup grp = GridTerminalSystem.GetBlockGroupWithName(name); if (grp != null) grp.GetBlocksOfType<IMyBatteryBlock>(batts, IsMyGrid); } else GridTerminalSystem.GetBlocksOfType<IMyBatteryBlock>(batts, delegate(IMyBatteryBlock b) { return IsMyGrid(b) && b.CustomName.IndexOf(name, StringComparison.OrdinalIgnoreCase) >= 0; }); for (int i = 0; i < batts.Count; i++) batts[i].ChargeMode = chargeMode; }',
    tank_stockpile: 'void SetTankStockpile(string gasType, bool stockpile, string filter) { List<IMyGasTank> tanks = new List<IMyGasTank>(); GridTerminalSystem.GetBlocksOfType<IMyGasTank>(tanks, delegate(IMyGasTank t) { if (!IsMyGrid(t)) return false; bool isH2 = t.BlockDefinition.SubtypeId.IndexOf("Hydrogen", StringComparison.OrdinalIgnoreCase) >= 0; if (gasType == "hydrogen" && !isH2) return false; if (gasType == "oxygen" && isH2) return false; return string.IsNullOrEmpty(filter) || t.CustomName.IndexOf(filter, StringComparison.OrdinalIgnoreCase) >= 0; }); for (int i = 0; i < tanks.Count; i++) tanks[i].Stockpile = stockpile; }',
    connector_action: 'void ControlConnector(string name, string action) { IMyShipConnector c = GridTerminalSystem.GetBlockWithName(name) as IMyShipConnector; if (c == null) { Echo("WARNING: Connector not found -> " + name); return; } if (action == "connect") c.Connect(); else if (action == "disconnect") c.Disconnect(); else c.ToggleConnect(); }',
    thruster_override: 'void SetThrusterOverride(string mode, string name, float ratio) { List<IMyThrust> list = new List<IMyThrust>(); if (mode == "all") GridTerminalSystem.GetBlocksOfType<IMyThrust>(list, IsMyGrid); else if (mode == "group") { IMyBlockGroup grp = GridTerminalSystem.GetBlockGroupWithName(name); if (grp != null) grp.GetBlocksOfType<IMyThrust>(list, IsMyGrid); } else GridTerminalSystem.GetBlocksOfType<IMyThrust>(list, delegate(IMyThrust t) { return IsMyGrid(t) && t.CustomName.IndexOf(name, StringComparison.OrdinalIgnoreCase) >= 0; }); for (int i = 0; i < list.Count; i++) list[i].ThrustOverridePercentage = ratio; }',
    sound_action: 'void ControlSound(string name, string action, string soundName) { IMySoundBlock sb = GridTerminalSystem.GetBlockWithName(name) as IMySoundBlock; if (sb == null) { Echo("WARNING: Sound Block not found -> " + name); return; } if (action == "play") { if (!string.IsNullOrEmpty(soundName)) sb.SelectedSound = soundName; sb.Play(); } else sb.Stop(); }',
    timer_action: 'void ControlTimer(string name, string action) { IMyTimerBlock tb = GridTerminalSystem.GetBlockWithName(name) as IMyTimerBlock; if (tb == null) { Echo("WARNING: Timer Block not found -> " + name); return; } if (action == "trigger") tb.Trigger(); else if (action == "start") tb.StartCountdown(); else tb.StopCountdown(); }',
    broadcast_text: 'void SetBroadcastText(string devType, string name, string text, float radius) { if (devType == "beacon") { IMyBeacon bcn = GridTerminalSystem.GetBlockWithName(name) as IMyBeacon; if (bcn != null) { bcn.HudText = text; bcn.Radius = radius; bcn.Enabled = true; } } else { IMyRadioAntenna ant = GridTerminalSystem.GetBlockWithName(name) as IMyRadioAntenna; if (ant != null) { ant.HudText = text; ant.Radius = radius; ant.EnableBroadcasting = true; ant.Enabled = true; } } }',
    piston_action: 'void ControlPistons(string mode, string name, string action, float speed) { List<IMyPistonBase> list = new List<IMyPistonBase>(); if (mode == "group") { IMyBlockGroup grp = GridTerminalSystem.GetBlockGroupWithName(name); if (grp != null) grp.GetBlocksOfType<IMyPistonBase>(list, IsMyGrid); } else { IMyPistonBase p = GridTerminalSystem.GetBlockWithName(name) as IMyPistonBase; if (p != null) list.Add(p); } for (int i = 0; i < list.Count; i++) { if (action == "extend") { list[i].Velocity = Math.Abs(speed); list[i].Extend(); } else if (action == "retract") { list[i].Velocity = -Math.Abs(speed); list[i].Retract(); } else if (action == "reverse") list[i].Reverse(); else list[i].Velocity = 0f; } }',
    rotor_action: 'void ControlRotors(string mode, string name, string action, float rpm) { List<IMyMotorStator> list = new List<IMyMotorStator>(); if (mode == "group") { IMyBlockGroup grp = GridTerminalSystem.GetBlockGroupWithName(name); if (grp != null) grp.GetBlocksOfType<IMyMotorStator>(list, IsMyGrid); } else { IMyMotorStator r = GridTerminalSystem.GetBlockWithName(name) as IMyMotorStator; if (r != null) list.Add(r); } for (int i = 0; i < list.Count; i++) { if (action == "spin") { list[i].RotorLock = false; list[i].TargetVelocityRPM = rpm; } else if (action == "stop") list[i].TargetVelocityRPM = 0f; else if (action == "lock") list[i].RotorLock = true; else list[i].RotorLock = false; } }'
  };

  function generateScript(project) {
    var helpers = {}, timers = [], reqMap = {}, argsMap = {}, issues = [], insideGui = false;

    function addReq(name, blockType, matchMode, purpose) {
      var clean = String(name || '').trim();
      var k = matchMode + ':' + blockType + ':' + clean.toLowerCase();
      if (!reqMap[k]) reqMap[k] = { name: clean || '(All Matching Blocks)', blockType: blockType, matchMode: matchMode, purpose: purpose };
    }
    function guiPctExpr(src, tgt, bid) {
      if (src === 'battery_pct') { helpers.battery_pct = true; addReq('Ship Batteries', 'Battery', 'All on Ship', 'Displayed on GUI HUD'); return 'GetBatteryPercent("")'; }
      if (src === 'h2_pct') { helpers.gas_pct = true; addReq('Hydrogen Tanks', 'Hydrogen Tank', 'All on Ship', 'Displayed on GUI HUD'); return 'GetGasPercent(true, "")'; }
      if (src === 'o2_pct') { helpers.gas_pct = true; addReq('Oxygen Tanks', 'Oxygen Tank', 'All on Ship', 'Displayed on GUI HUD'); return 'GetGasPercent(false, "")'; }
      if (src === 'cargo_pct') { helpers.cargo_pct = true; addReq('Cargo Containers', 'Cargo / Inventory', 'All on Ship', 'Displayed on GUI HUD'); return 'GetCargoPercent("")'; }
      if (src === 'vent_o2_pct') { helpers.vent_o2 = true; var t = sVal(tgt).trim(); if (t) addReq(t, 'Air Vent', 'Exact Name', 'Displayed on GUI HUD'); else issues.push({ severity: 'warning', message: 'GUI Bar (Air Vent O2) needs a Vent name.', blockId: bid }); return 'GetVentOxygenPercent("' + escCs(t) + '")'; }
      if (src === 'ship_speed') { helpers.ship_speed = true; addReq('Cockpit / Remote', 'Ship Controller', 'All on Ship', 'Reads ship speed'); return 'Math.Min(100.0, GetShipSpeed())'; }
      if (src === 'variable') { helpers.vars = true; return 'GetVar("' + escCs(sVal(tgt, 'val').trim() || 'val') + '")'; }
      return '0.0';
    }
    function tplExpr(text) {
      var raw = sVal(text);
      if (/\{[^}]+\}/.test(raw)) {
        helpers.template = true; helpers.vars = true;
        if (raw.indexOf('{battery}') >= 0 || raw.indexOf('{bar:battery}') >= 0) helpers.battery_pct = true;
        if (raw.indexOf('{h2}') >= 0 || raw.indexOf('{bar:h2}') >= 0 || raw.indexOf('{o2}') >= 0 || raw.indexOf('{bar:o2}') >= 0) helpers.gas_pct = true;
        if (raw.indexOf('{cargo}') >= 0 || raw.indexOf('{bar:cargo}') >= 0) helpers.cargo_pct = true;
        if (raw.indexOf('{speed}') >= 0) helpers.ship_speed = true;
        if (raw.indexOf('{gravity}') >= 0) helpers.gravity_g = true;
        if (raw.indexOf('{solar}') >= 0) helpers.solar_mw = true;
        if (raw.indexOf('{reactor}') >= 0) helpers.reactor_mw = true;
        if (raw.indexOf('{bar:') >= 0) helpers.bar = true;
        return 'FormatTemplate("' + escCs(raw) + '")';
      }
      return '"' + escCs(raw) + '"';
    }
    function condExpr(b) {
      var p = b.params || {}, src = sVal(p.source, 'battery_pct'), tgt = sVal(p.target).trim();
      var op = ['<', '<=', '>', '>=', '==', '!='].indexOf(sVal(p.operator)) >= 0 ? sVal(p.operator) : '<';
      var expect = sVal(p.boolExpect, 'true') === 'true', rawVal = sVal(p.value, '0');
      if (src === 'argument_equals') { if (rawVal.trim()) argsMap[rawVal.trim()] = true; return 'argument.Equals("' + escCs(rawVal.trim()) + '", StringComparison.OrdinalIgnoreCase)'; }
      if (BOOL_SOURCES.indexOf(src) >= 0) {
        var ex = 'false';
        if (src === 'door_is_open') { helpers.door_open = true; if (tgt) addReq(tgt, 'Door', 'Exact Name', 'Checked if open'); else issues.push({ severity: 'warning', message: 'Door Is Open needs a Door name.', blockId: b.id }); ex = 'IsDoorOpen("' + escCs(tgt) + '")'; }
        else if (src === 'connector_connected') { helpers.connector_state = true; if (tgt) addReq(tgt, 'Connector', 'Exact Name', 'Checked for connection'); else issues.push({ severity: 'warning', message: 'Connector Connected needs a name.', blockId: b.id }); ex = 'IsConnectorStatus("' + escCs(tgt) + '", MyShipConnectorStatus.Connected)'; }
        else if (src === 'connector_ready') { helpers.connector_state = true; if (tgt) addReq(tgt, 'Connector', 'Exact Name', 'Checked if ready to lock'); ex = 'IsConnectorStatus("' + escCs(tgt) + '", MyShipConnectorStatus.Connectable)'; }
        else if (src === 'sensor_active') { helpers.sensor_active = true; if (tgt) addReq(tgt, 'Sensor', 'Exact Name', 'Checked for detection'); ex = 'IsSensorActive("' + escCs(tgt) + '")'; }
        else if (src === 'turret_has_target') { helpers.turret_target = true; addReq(tgt || 'Ship Turrets', 'Turret(s)', tgt ? 'Name Tag' : 'All on Ship', 'Monitored for targets'); ex = 'AnyTurretHasTarget("' + escCs(tgt) + '")'; }
        else if (src === 'block_enabled') { helpers.block_enabled = true; if (tgt) addReq(tgt, 'Functional Block', 'Exact Name', 'Checked if ON'); ex = 'IsBlockEnabled("' + escCs(tgt) + '")'; }
        return expect ? ex : '!' + ex;
      }
      var lhs = '0.0';
      if (src === 'battery_pct') { helpers.battery_pct = true; addReq('Ship Batteries', 'Battery', 'All on Ship', 'Monitored charge %'); lhs = 'GetBatteryPercent("")'; }
      else if (src === 'h2_pct') { helpers.gas_pct = true; addReq('Hydrogen Tanks', 'Hydrogen Tank', 'All on Ship', 'Monitored H2 %'); lhs = 'GetGasPercent(true, "")'; }
      else if (src === 'o2_pct') { helpers.gas_pct = true; addReq('Oxygen Tanks', 'Oxygen Tank', 'All on Ship', 'Monitored O2 %'); lhs = 'GetGasPercent(false, "")'; }
      else if (src === 'cargo_pct') { helpers.cargo_pct = true; addReq('Cargo Containers', 'Cargo', 'All on Ship', 'Monitored cargo fill %'); lhs = 'GetCargoPercent("")'; }
      else if (src === 'vent_o2_pct') { helpers.vent_o2 = true; if (tgt) addReq(tgt, 'Air Vent', 'Exact Name', 'Monitored room O2 %'); else issues.push({ severity: 'warning', message: 'Air Vent Oxygen % needs a Vent name.', blockId: b.id }); lhs = 'GetVentOxygenPercent("' + escCs(tgt) + '")'; }
      else if (src === 'ship_speed') { helpers.ship_speed = true; addReq('Cockpit / Remote', 'Ship Controller', 'All on Ship', 'Reads ship speed'); lhs = 'GetShipSpeed()'; }
      else if (src === 'gravity_g') { helpers.gravity_g = true; addReq('Cockpit / Remote', 'Ship Controller', 'All on Ship', 'Reads gravity'); lhs = 'GetGravityG()'; }
      else if (src === 'solar_mw') { helpers.solar_mw = true; addReq('Solar Panels', 'Solar Panel', 'All on Ship', 'Reads solar MW'); lhs = 'GetSolarOutputMW()'; }
      else if (src === 'reactor_mw') { helpers.reactor_mw = true; addReq('Reactors', 'Reactor', 'All on Ship', 'Reads reactor MW'); lhs = 'GetReactorOutputMW()'; }
      else if (src === 'projector_remaining') { helpers.projector_remaining = true; if (tgt) addReq(tgt, 'Projector', 'Exact Name', 'Reads blocks left'); lhs = 'GetProjectorRemaining("' + escCs(tgt) + '")'; }
      else if (src === 'item_count') { helpers.item_count = true; lhs = 'GetItemCount("' + escCs(sVal(p.itemCategory, 'MyObjectBuilder_Ingot')) + '", "' + escCs(sVal(p.itemSubtype, 'Uranium')) + '")'; }
      else if (src === 'variable') {
        helpers.vars = true;
        var vn = sVal(p.varName, 'state').trim() || 'state';
        if (isNaN(Number(rawVal)) && (op === '==' || op === '!=')) {
          var cmp = 'GetTextVar("' + escCs(vn) + '").Equals("' + escCs(rawVal) + '", StringComparison.OrdinalIgnoreCase)';
          return op === '==' ? cmp : '!' + cmp;
        }
        lhs = 'GetVar("' + escCs(vn) + '")';
      }
      return lhs + ' ' + op + ' ' + nVal(rawVal, 0);
    }

    function emitList(blocks, ind) {
      var out = [];
      for (var i = 0; i < blocks.length; i++) {
        var b = blocks[i]; if (b.disabled || b.type === 'on_setup') continue;
        var def = BLOCK_MAP[b.type], p = b.params || {};
        if (def && def.guiWidget && !insideGui) {
          issues.push({ severity: 'warning', message: '"' + def.label + '" must be placed inside a "GUI Screen Canvas" block.', blockId: b.id });
          out.push(ind + '// Skipped "' + def.label + '" — place inside a GUI Screen Canvas');
          continue;
        }
        if (b.type === 'gui_screen') {
          if (insideGui) { issues.push({ severity: 'warning', message: 'GUI Screen Canvas cannot be nested inside another GUI Screen Canvas.', blockId: b.id }); continue; }
          helpers.gui_core = true;
          var gln = sVal(p.lcdName, 'Status LCD').trim(), sIdx = Math.max(0, Math.round(nVal(p.surfaceIndex, 0)));
          if (gln) addReq(gln, sIdx > 0 ? 'Cockpit / Screen #' + sIdx : 'LCD Panel or Cockpit', 'Exact Name', 'Renders modern vector GUI HUD');
          else issues.push({ severity: 'warning', message: 'GUI Screen Canvas needs an LCD or Cockpit block name.', blockId: b.id });
          out.push(ind + '{');
          out.push(ind + '    IMyTextSurface _guiSurf = GetGuiSurface("' + escCs(gln) + '", ' + sIdx + ', ' + colCs(p.bgColor, '#08111A') + ');');
          out.push(ind + '    if (_guiSurf != null)');
          out.push(ind + '    {');
          out.push(ind + '        RectangleF _guiVp = new RectangleF((_guiSurf.TextureSize - _guiSurf.SurfaceSize) / 2f, _guiSurf.SurfaceSize);');
          out.push(ind + '        float _guiY = _guiVp.Y + Math.Max(8f, _guiVp.Height * 0.03f);');
          out.push(ind + '        using (MySpriteDrawFrame _guiFrame = _guiSurf.DrawFrame())');
          out.push(ind + '        {');
          out.push(ind + '            GuiDrawBackdrop(_guiFrame, _guiVp, ' + colCs(p.frameColor, '#2B9FD9') + ', ' + (p.showFrame ? 'true' : 'false') + ', ' + (p.showGrid ? 'true' : 'false') + ');');
          insideGui = true;
          var gBody = emitList(b.children || [], ind + '            ');
          insideGui = false;
          out = out.concat(gBody.length ? gBody : [ind + '            // Add GUI widgets inside this canvas']);
          out.push(ind + '        }');
          out.push(ind + '    }');
          out.push(ind + '}');
        } else if (b.type === 'gui_header') {
          helpers.gui_core = helpers.gui_header = true;
          out.push(ind + 'GuiDrawHeader(_guiFrame, _guiVp, ref _guiY, ' + tplExpr(p.title) + ', ' + tplExpr(p.badge) + ', ' + colCs(p.accentColor, '#38A3D1') + ');');
        } else if (b.type === 'gui_bar') {
          helpers.gui_core = helpers.gui_bar = true;
          out.push(ind + 'GuiDrawBar(_guiFrame, _guiVp, ref _guiY, ' + tplExpr(p.label) + ', ' + guiPctExpr(sVal(p.source, 'battery_pct'), p.target, b.id) + ', "' + escCs(sVal(p.style, 'segmented')) + '", "' + escCs(sVal(p.icon, 'none')) + '", "' + escCs(sVal(p.colorMode, 'auto')) + '", ' + colCs(p.color, '#22C55E') + ');');
        } else if (b.type === 'gui_gauges') {
          helpers.gui_core = helpers.gui_gauges = true;
          var gc = sVal(p.count, '3') === '2' ? 2 : 3, gls = [], gvs = [];
          for (var gi = 1; gi <= gc; gi++) { gls.push('"' + escCs(sVal(p['label' + gi], 'GAUGE ' + gi)) + '"'); gvs.push(guiPctExpr(sVal(p['source' + gi], 'battery_pct'), '', b.id)); }
          out.push(ind + 'GuiDrawGauges(_guiFrame, _guiVp, ref _guiY, new string[] { ' + gls.join(', ') + ' }, new double[] { ' + gvs.join(', ') + ' });');
        } else if (b.type === 'gui_metrics') {
          helpers.gui_core = helpers.gui_metrics = true;
          var mc = sVal(p.count, '3') === '2' ? 2 : 3, mls = [], mvs = [];
          for (var mi = 1; mi <= mc; mi++) { mls.push('"' + escCs(sVal(p['label' + mi], 'STAT ' + mi)) + '"'); mvs.push(tplExpr(sVal(p['val' + mi], '0'))); }
          out.push(ind + 'GuiDrawMetrics(_guiFrame, _guiVp, ref _guiY, ' + colCs(p.accentColor, '#38A3D1') + ', new string[] { ' + mls.join(', ') + ' }, new string[] { ' + mvs.join(', ') + ' });');
        } else if (b.type === 'gui_alert') {
          helpers.gui_core = helpers.gui_alert = true;
          out.push(ind + 'GuiDrawAlert(_guiFrame, _guiVp, ref _guiY, "' + escCs(sVal(p.severity, 'critical')) + '", ' + tplExpr(p.message) + ');');
        } else if (b.type === 'gui_inventory') {
          helpers.gui_core = helpers.gui_bar = helpers.format_num = helpers.gui_inventory = true;
          var iflt = sVal(p.containerFilter).trim();
          addReq(iflt || 'Cargo / Refineries / Assemblers', 'Inventory Blocks', iflt ? 'Name Tag' : 'All on Ship', 'Scanned for GUI inventory bars');
          out.push(ind + 'GuiDrawInventory(_guiFrame, _guiVp, ref _guiY, "' + escCs(sVal(p.category, 'all')) + '", "' + escCs(sVal(p.sortBy, 'amount_desc')) + '", ' + Math.max(1, Math.round(nVal(p.maxItems, 8))) + ', ' + colCs(p.accentColor, '#38D9A9') + ', "' + escCs(iflt) + '");');
        } else if (b.type === 'gui_text') {
          helpers.gui_core = helpers.gui_text = true;
          var gal = ['LEFT', 'CENTER', 'RIGHT'].indexOf(sVal(p.align)) >= 0 ? sVal(p.align) : 'CENTER';
          out.push(ind + 'GuiDrawText(_guiFrame, _guiVp, ref _guiY, ' + tplExpr(p.text) + ', "' + escCs(sVal(p.size, 'body')) + '", TextAlignment.' + gal + ', ' + colCs(p.color, '#E2E8F0') + ');');
        } else if (b.type === 'gui_divider') {
          helpers.gui_core = helpers.gui_divider = true;
          out.push(ind + 'GuiDrawDivider(_guiFrame, _guiVp, ref _guiY, ' + tplExpr(sVal(p.label).trim()) + ', ' + colCs(p.color, '#334155') + ');');
        } else if (b.type === 'comment') {
          var note = sVal(p.text).replace(/\r?\n/g, ' ').trim(); if (note) out.push(ind + '// ' + note);
        } else if (b.type === 'on_argument') {
          var arg = sVal(p.argument, 'toggle').trim(); if (arg) argsMap[arg] = true;
          out.push(ind + 'if (argument.Equals("' + escCs(arg) + '", StringComparison.OrdinalIgnoreCase))', ind + '{');
          var body = emitList(b.children || [], ind + '    ');
          out = out.concat(body.length ? body : [ind + '    // Add action blocks here']);
          out.push(ind + '}');
        } else if (b.type === 'if_condition') {
          out.push(ind + 'if (' + condExpr(b) + ')', ind + '{');
          var tb = emitList(b.children || [], ind + '    ');
          out = out.concat(tb.length ? tb : [ind + '    // Actions when true']);
          out.push(ind + '}');
          if (p.hasElse) {
            out.push(ind + 'else', ind + '{');
            var eb = emitList(b.elseChildren || [], ind + '    ');
            out = out.concat(eb.length ? eb : [ind + '    // Actions when false']);
            out.push(ind + '}');
          }

      area.value = JSON.stringify(project, null, 2);
      jsonModal.querySelector('.m-close').addEventListener('click', function () { jsonModal.hidden = true; });
      document.getElementById('j-cp').addEventListener('click', function () { copyText(area.value, 'Blueprint JSON copied'); });
      document.getElementById('j-dl').addEventListener('click', function () { downloadFile('gridlogic-blueprint.json', area.value, 'application/json'); showToast('Downloaded gridlogic-blueprint.json'); });
      document.getElementById('j-imp').addEventListener('click', function () {
        try {
          var parsed = JSON.parse(area.value);
          if (!parsed || typeof parsed.name !== 'string' || !Array.isArray(parsed.blocks)) throw new Error('Invalid GridLogic blueprint JSON.');
          pushHistory(); project = { name: parsed.name, description: String(parsed.description || ''), updateFrequency: parsed.updateFrequency || 'Update100', sameGridOnly: parsed.sameGridOnly !== false, blocks: cloneWithIds(parsed.blocks) };
          selectedId = null; renderAll(true); jsonModal.hidden = true; showToast('Blueprint loaded');
        } catch (e) { err.textContent = e.message; err.hidden = false; }
      });
    }

    /* ----- EVENTS ----- */
    document.getElementById('toolbox-search').addEventListener('input', function (e) { searchQ = e.target.value.trim().toLowerCase(); renderToolbox(); });
    nameInput.addEventListener('input', function () { project.name = nameInput.value; refreshOutput(false); });
    document.getElementById('open-presets-btn').addEventListener('click', openPresets);
    document.getElementById('new-blank-btn').addEventListener('click', function () { pushHistory(); project = { name: 'My Custom Ship Script', description: 'Custom Space Engineers script built with GridLogic.', updateFrequency: 'Update10', sameGridOnly: true, blocks: [] }; selectedId = null; renderAll(true); showToast('Created blank script'); });
    undoBtn.addEventListener('click', function () { if (!undoStack.length) return; redoStack.push(clone(project)); project = undoStack.pop(); renderAll(true); });
    redoBtn.addEventListener('click', function () { if (!redoStack.length) return; undoStack.push(clone(project)); project = redoStack.pop(); renderAll(true); });
    document.getElementById('json-btn').addEventListener('click', openJsonModal);
    document.getElementById('guide-btn').addEventListener('click', function () { activeTab = 'setup'; simMounted = false; renderInspectorTabs(); renderInspectorBody(); });
    copyBtn.addEventListener('click', copyScript);
    wsScroll.addEventListener('click', function (ev) { if (ev.target === wsScroll || ev.target === wsStack) { selectedId = null; renderWorkspace(); } });
    presetsModal.addEventListener('click', function (ev) { if (ev.target === presetsModal) presetsModal.hidden = true; });
    jsonModal.addEventListener('click', function (ev) { if (ev.target === jsonModal) jsonModal.hidden = true; });
    window.addEventListener('keydown', function (ev) {
      var inEd = ev.target && ['INPUT', 'TEXTAREA', 'SELECT'].indexOf(ev.target.tagName) >= 0;
      if ((ev.ctrlKey || ev.metaKey) && ev.key.toLowerCase() === 'z' && !inEd) { ev.preventDefault(); if (ev.shiftKey) redoBtn.click(); else undoBtn.click(); }
      else if ((ev.ctrlKey || ev.metaKey) && ev.key.toLowerCase() === 'y' && !inEd) { ev.preventDefault(); redoBtn.click(); }
      else if (ev.key === 'Escape') { presetsModal.hidden = true; jsonModal.hidden = true; }
    });

    renderToolbox();
    renderAll(true);
  }

  try {
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', bootApp);
    else bootApp();
  } catch (err) {
    var el = document.getElementById('app');
    if (el) el.innerHTML = '<div style="padding:24px;color:#fca5a5;font-family:monospace">GridLogic startup error: ' + String(err) + '</div>';
  }
})();
</script>
</body>
</html>
